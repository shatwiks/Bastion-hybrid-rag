[project]
name = "rag-engine-backend"
version = "0.1.0"
description = "Enterprise Multi-Tenant RAG Knowledge Engine Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.3",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.8",
    "greenlet>=3.1.1",
    "asyncpg==0.32.0",
    "pgvector==0.5.1",
    "alembic==1.20.1",
    "redis==8.1.0",
    "redisvl==0.31.0",
    "qdrant-client==1.20.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "pyjwt[crypto]==2.15.1",
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
    "langchain-text-splitters==1.1.3",
    "sentence-transformers",
    "torch",
    "python-multipart",
    "litellm",
    "langfuse",
    "ragas",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
