<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Bastion Hybrid RAG — Enterprise Multi-Tenant Knowledge Engine">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="15%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="320" rx="18"/>
    </clipPath>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #94a3b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .pill-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 20px; }
      .pill-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 11px; fill: #94a3b8; letter-spacing: 0.4px; }
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.45; }
        50% { transform: scale(1.09); opacity: 0.12; }
      }
      @keyframes scan {
        0% { transform: translateX(-220px); opacity: 0; }
        15% { opacity: 0.55; }
        85% { opacity: 0.55; }
        100% { transform: translateX(1220px); opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .ring { transform-origin: 96px 120px; animation: pulseRing 3.4s ease-in-out infinite; }
      .scanline { animation: scan 6.5s linear infinite; }
      .live-dot { animation: blink 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="1200" height="320" fill="url(#bgGrad)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowLeft)"/>
    <rect width="1200" height="320" fill="url(#glowRight)"/>

    <!-- Subtle Animated Scan Beam -->
    <rect class="scanline" x="0" y="0" width="180" height="320" fill="url(#accentGrad)" opacity="0.06"/>

    <!-- Top accent bar -->
    <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)"/>

    <!-- Outer border -->
    <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Animated Shield Emblem -->
    <circle class="ring" cx="96" cy="120" r="46" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <rect x="56" y="80" width="80" height="80" rx="20" fill="#0b1f2e" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M96 95 L118 104 V121 C118 135 108 145 96 149 C84 145 74 135 74 121 V104 Z" fill="url(#shieldGrad)" opacity="0.95"/>
    <path d="M88 121 L94 127 L106 113" fill="none" stroke="#020617" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Status Badge -->
    <rect x="160" y="68" width="248" height="26" rx="13" fill="#064e3b" fill-opacity="0.45" stroke="#10b981" stroke-opacity="0.5"/>
    <circle class="live-dot" cx="176" cy="81" r="4.5" fill="#34d399"/>
    <text x="188" y="85" class="mono" font-size="11.5" fill="#6ee7b7" font-weight="600">PRE-RETRIEVAL RBAC · ZERO LEAKS</text>

    <!-- Main Heading -->
    <text x="160" y="138" class="title" font-size="42">Bastion Hybrid RAG</text>
    <text x="160" y="168" class="sub" font-size="17">Enterprise Multi-Tenant Knowledge Engine — SQL RBAC · pgvector + BM25 RRF · Cross-Encoder Gate · Live Telemetry</text>

    <!-- Bottom 4 Verified Metric Cards -->
    <!-- Card 1 -->
    <g transform="translate(56, 206)">
      <rect width="256" height="78" rx="12" fill="#0f172a" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="78" rx="2" fill="#10b981"/>
      <text x="20" y="34" class="pill-val" fill="#34d399">100.0%</text>
      <text x="108" y="32" class="mono" font-size="11" fill="#6ee7b7">vs 81.4% naive</text>
      <text x="20" y="57" class="pill-lbl">RETRIEVAL PRECISION (28 PROBES)</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(332, 206)">
      <rect width="256" height="78" rx="12" fill="#0f172a" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="78" rx="2" fill="#38bdf8"/>
      <text x="20" y="34" class="pill-val" fill="#38bdf8">+32.59%</text>
      <text x="115" y="32" class="mono" font-size="11" fill="#7dd3fc">MRR 0.75 → 1.00</text>
      <text x="20" y="57" class="pill-lbl">HYBRID RRF + RERANKER LIFT</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(608, 206)">
      <rect width="256" height="78" rx="12" fill="#0f172a" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="78" rx="2" fill="#f59e0b"/>
      <text x="20" y="34" class="pill-val" fill="#fbbf24">0 Tokens</text>
      <text x="114" y="32" class="mono" font-size="11" fill="#fde68a">100% trap block</text>
      <text x="20" y="57" class="pill-lbl">REFUSAL GATE (&lt; 0.65 CONFIDENCE)</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(884, 206)">
      <rect width="260" height="78" rx="12" fill="#0f172a" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="78" rx="2" fill="#818cf8"/>
      <text x="20" y="34" class="pill-val" fill="#a5b4fc">0.0% Leaks</text>
      <text x="134" y="32" class="mono" font-size="11" fill="#c7d2fe">SQL + Redis</text>
      <text x="20" y="57" class="pill-lbl">CROSS-TENANT &amp; ROLE ISOLATION</text>
    </g>
  </g>
</svg>
